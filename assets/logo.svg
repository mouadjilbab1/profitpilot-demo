<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (64x64 at x=8, y=8) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#iconBg)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4"/>
    
    <!-- Bars -->
    <rect x="14" y="42" width="7" height="12" rx="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="24" y="34" width="7" height="20" rx="2" fill="#06b6d4" opacity="0.75"/>
    <rect x="34" y="24" width="7" height="30" rx="2" fill="#10b981" opacity="0.9"/>
    
    <!-- Wing / Arrow -->
    <path d="M 20 50 L 52 18 L 46 38 L 36 42 Z" fill="url(#logoGrad)" filter="url(#logoGlow)"/>
    <path d="M 52 18 L 32 30 L 38 24 Z" fill="#67e8f9"/>
    <circle cx="52" cy="18" r="3.5" fill="#ffffff" filter="url(#logoGlow)"/>
    <circle cx="52" cy="18" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Brand Typography -->
  <text x="86" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">ProfitPilot</text>
  
  <!-- AI Badge -->
  <g transform="translate(230, 22)">
    <rect x="0" y="0" width="38" height="24" rx="6" fill="url(#logoGrad)"/>
    <text x="19" y="17" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">AI</text>
  </g>

  <!-- Slogan -->
  <text x="88" y="62" font-family="'Inter', 'Cairo', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">INTELLIGENT COD ANALYTICS</text>
</svg>
