<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ppGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Financial Bar Chart Base (Growing upward) -->
  <rect x="22" y="60" width="10" height="18" rx="3" fill="#3b82f6" opacity="0.6"/>
  <rect x="36" y="48" width="10" height="30" rx="3" fill="#06b6d4" opacity="0.75"/>
  <rect x="50" y="34" width="10" height="44" rx="3" fill="#10b981" opacity="0.9"/>

  <!-- Supersonic Pilot Jet Wings / Arrow Soaring Upward -->
  <path d="M 30 72 L 76 26 L 68 56 L 54 62 Z" fill="url(#ppGrad)" filter="url(#glow)"/>
  <path d="M 76 26 L 46 44 L 56 36 Z" fill="#67e8f9"/>
  <path d="M 76 26 L 70 38 L 62 34 Z" fill="#ffffff"/>

  <!-- AI Spark / Financial Apex Star -->
  <circle cx="76" cy="26" r="4.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="76" cy="26" r="2" fill="#38bdf8"/>
</svg>
